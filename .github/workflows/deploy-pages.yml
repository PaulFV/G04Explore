name: Deploy G04Explore to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Create runtime configuration
        env:
          GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.GOOGLE_MAPS_BROWSER_KEY }}
          # Optional: eigene Map-ID als Repository-Variable (kein Geheimnis).
          GOOGLE_MAPS_MAP_ID: ${{ vars.GOOGLE_MAPS_MAP_ID }}
        run: |
          node -e "const fs = require('node:fs'); const key = (process.env.GOOGLE_MAPS_BROWSER_KEY || '').trim(); if (!key) throw new Error('Missing repository secret GOOGLE_MAPS_BROWSER_KEY'); const mapId = (process.env.GOOGLE_MAPS_MAP_ID || '').trim(); fs.writeFileSync('config.js', 'window.G04_CONFIG = ' + JSON.stringify({ googleMapsKey: key, googleMapId: mapId }) + ';\\n');"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
